[project]
name = "count-ts-window-selector"
version = "0.1.0"
description = "Select Poisson-compatible time windows for higher-event-rate count time series."
readme = "README.md"
authors = [
    { name = "Rajiv Sambasivan", email = "rajiv.sambasivan@r2-ds.com" }
]
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.11.0",
]

[project.scripts]
count-ts-window-selector = "count_ts_window_selector:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
